<pattern id="rollers" width="7.5" height="7.5" patternUnits="userSpaceOnUse">
<rect width="7.5" height="7.5" fill="#e6eaef"/><line x1="3.75" y1="0" x2="3.75" y2="7.5" stroke="#bcc5cf" stroke-width="2.2"/></pattern>
