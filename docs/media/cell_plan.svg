<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 849" width="1024" height="849" font-family="Inter, Noto Sans, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Pack-off cell, Layout v2, top view</title>
<desc id="d">Top view of the U cell. The G2 drives in from the open floor. The pick table is on its left, the conveyor is in front and the sort rack is on its right. Cartons move from the case erector along the conveyor, over a drop gap with a floor bin, to a right-angle transfer, the case sealer and the cobot palletiser.</desc>
