# g2_packoff_cell Stage 2: the static salad pack-off cell (assets/cell/build.py ->
# /geniesim_assets/scenes/g2cell/cell.usda) with the G2 at the cell origin.
# Derived from scene_pnp_g2_op_cam.yaml (upstream scene_pnp_g2_op @6ca11c7 + head camera fix).
# Launch: bash /g2cell_ws/scripts/stage1_up.sh /g2cell_ws/config/scenes/scene_g2cell.yaml
robot:
  robot_name: G2_crs_omnipicker
  robot_prefix: genie
  robot_source:
    arm: crs
    body: g2
    gripper: "omnipicker"
    robot_model: genie
    package: genie_sim_robot_model
    pin_base_to_world: true   # keep URDF root_joint → use kinematic-control substep (stationary humanoid)
    convert_joints_to_fixed: []   # [base, head, body] to weld sub-trees; empty = keep all articulated
    urdf: {}
  # Cell origin = G2 base on the floor. z 0.04: the robot's lowest point (wheels) is at
  # -0.041 in robot.usda, so this puts the wheels on the floor (as upstream does).
  # head_cam_tf_relay.py (--scene this file) reads this block and publishes the same root pose
  # for /genie on the render stage, so physics and render robots coincide.
  init_base_pose:
    x: 0.0
    y: 0.0
    z: 0.04
    theta: 0.0
  init_joint_pos:
    idx22_arm_l_joint2: -45
    idx24_arm_l_joint4: -75
    idx26_arm_l_joint6: -55
    idx62_arm_r_joint2: -45
    idx64_arm_r_joint4: -75
    idx66_arm_r_joint6: -55
    idx03_body_joint3: 20
    # head turned left/down so the head camera sees the pick table and the pack crate
    idx11_head_joint1: 40
    idx13_head_joint3: 28

# OVRTX FreeCam (1280x720, 90 deg HFOV), Layout v2: high above the -X wall looking down the U's opening,
# so the U (table, robot, rack), the conveyor with cartons and the whole end of line are visible.
# NOTE: the Isaac PhysX launcher ignores viewer_camera (FreeCam stays at assemble_scene's
# top-down default); scripts/free_cam_pose.py --scene <this file> applies it (stage1_up.sh
# starts it in the "freecam" tmux window).
free_cam_width: 1280
free_cam_height: 720
viewer_camera:
  pos:    [-4.2, -0.3, 3.85]
  lookat: [1.2, -0.5, 0.0]

cameras:
- prim_path: head_link3/Head_Front_Camera
  frame_id: head_link3
  topic:
    rgb: /genie_sim/head_front_camera_rgb
    depth: /genie_sim/head_front_camera_depth
  sensor:
    width: 640
    height: 400
    freq: 10.0
    min_range: 0.01
    max_range: 10000
  intrinsic:
    cx: 318.7979431152
    cy: 202.4943847656
    fx: 305.6425170898
    fy: 305.6007080078
    k1: 0
    k2: 0
    p1: 0
    p2: 0
    k3: 0
  # Official G2 head_front_Camera mount on head_link3, copied verbatim from
  # geniesim_assets/robot/G2_omnipicker/robot.usda (USD camera convention, w-first).
  # Upstream's identity extrinsic is wrong, but the black frames had a second cause:
  # the render node only moves /RenderOVRTX/Cameras/head_link3 when a /tf_render
  # child_frame_id == "head_link3", while the engine publishes nested prim paths
  # (/genie/Geometry/base_link/.../head_link3) with parent-relative poses -> the camera
  # parent stays at world origin (inside the chassis). REQUIRES the relay
  # /g2cell_ws/scripts/head_cam_tf_relay.py running alongside the sim; it republishes
  # head_link3's world pose to /RenderOVRTX/Cameras/head_link3 on /tf_render.
  extrinsic:
    xyz: [0.10237, 0.02375, 0.10256]
    wxyz: [0.5945104121873723, 0.3868316461705512, -0.3787291472834019, -0.5945442627086477]
lidars: []
scene: scenes/g2cell/cell.usda
